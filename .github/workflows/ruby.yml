# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby-version: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', head, debug, truffleruby]
        include:
        - os: ubuntu
          ruby-version: head
          allowed-failure: true
        - os: macos
          ruby-version: head
          allowed-failure: true
        - os: ubuntu
          ruby-version: debug
          allowed-failure: true
        - os: macos
          ruby-version: debug
          allowed-failure: true
        - os: ubuntu
          ruby-version: truffleruby
          allowed-failure: true
        - os: macos
          ruby-version: truffleruby
          allowed-failure: true
    steps:
    - uses: actions/checkout@v7
    - name: Install libcurl header
      run: |
        if ${{ matrix.os == 'macos' }}
        then
          brew install curl
        else
          sudo apt update && sudo apt install -y --no-install-recommends libcurl4-openssl-dev
        fi
    - name: Set up Ruby
      id: setup-ruby
      continue-on-error: ${{ matrix.allowed-failure || false }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      id: tests
      continue-on-error: ${{ matrix.allowed-failure || false }}
      run: bundle exec rake
    - name: Report allowed failure
      if: ${{ always() && matrix.allowed-failure && (steps.setup-ruby.outcome == 'failure' || steps.tests.outcome == 'failure') }}
      run: printf '::warning::Allowed failure on %s Ruby %s\n' '${{ matrix.os }}' '${{ matrix.ruby-version }}'
