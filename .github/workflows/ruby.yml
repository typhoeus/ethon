# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.ruby-version }}${{ matrix.old_curl && ' (old curl)' || '' }}${{ matrix.latest_curl && github.event_name == 'push' && ' (latest curl)' || '' }})
    runs-on: ${{ matrix.os }}-latest
    env:
      BUNDLE_WITHOUT: perf
      CURL_VERSION: 8.23.0
      OLD_CURL_VERSION: 7.88.1
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu, ruby-version: '2.6' }
        - { os: ubuntu, ruby-version: '2.7' }
        - { os: ubuntu, ruby-version: '3.0' }
        - { os: ubuntu, ruby-version: '3.1' }
        - { os: ubuntu, ruby-version: '3.2' }
        - { os: ubuntu, ruby-version: '3.3' }
        - { os: ubuntu, ruby-version: '3.4' }
        - { os: ubuntu, ruby-version: '4.0', latest_curl: true }
        - { os: ubuntu, ruby-version: '3.2', old_curl: true }
        - { os: macos, ruby-version: '2.6' }
        - { os: macos, ruby-version: '3.2' }
        - { os: macos, ruby-version: '4.0' }
        - { os: windows, ruby-version: '3.2' }
    steps:
    - uses: actions/checkout@v7
    - name: Build curl
      if: ${{ matrix.old_curl || (matrix.latest_curl && github.event_name == 'push') }}
      env:
        CURL_BUILD_VERSION: ${{ matrix.old_curl && env.OLD_CURL_VERSION || env.CURL_VERSION }}
      run: |
        curl --fail --location --output curl.tar.xz "https://curl.se/download/curl-${CURL_BUILD_VERSION}.tar.xz"
        tar --extract --file curl.tar.xz
        mkdir curl-build
        cd curl-build
        "../curl-${CURL_BUILD_VERSION}/configure" \
          --prefix="${RUNNER_TEMP}/curl" \
          --disable-static \
          --enable-shared \
          --disable-ldap \
          --without-brotli \
          --without-libidn2 \
          --without-libpsl \
          --without-libssh2 \
          --without-zstd \
          --with-openssl \
          ${{ matrix.latest_curl && '--disable-form-api' || '' }}
        make --jobs="$(nproc)"
        make install
        printf 'ETHON_CURL_LIBS=%s/curl/lib/libcurl.so\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Install libcurl
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:RI_DEVKIT\usr\bin\bash.exe" -lc "pacman -S --noconfirm mingw-w64-ucrt-x86_64-curl"
        $bin = Join-Path $env:RI_DEVKIT "ucrt64\bin"
        Copy-Item (Join-Path $bin "libcurl-4.dll") (Join-Path $bin "libcurl.dll")
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Verify latest curl
      if: ${{ matrix.latest_curl && github.event_name == 'push' }}
      run: bundle exec ruby -Ilib -e 'require "ethon"; abort Ethon::Curl.version unless Ethon::Curl.version.start_with?("libcurl/#{ENV.fetch("CURL_VERSION")}")'
    - name: Verify older curl
      if: ${{ matrix.old_curl }}
      run: bundle exec ruby -Ilib -e 'require "ethon"; abort Ethon::Curl.version unless Ethon::Curl.version.start_with?("libcurl/#{ENV.fetch("OLD_CURL_VERSION")}")'
    - name: Run tests
      shell: bash
      run: bundle exec rake
